name: Native Grease handoff checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: isomorphisms/ai-ci/transfer-handoff@1c54573ab1cc5138356cfa9abeabdc681f7f897f
        with:
          catfood_ref: c16dcf0ab5057cbfd9cc7b0fedad587300724873
          kitchen_ref: 6f2870f0c614f46b2bd45d66f549799d50534ddf
          fp_ref: ${{ github.event.pull_request.head.sha || github.sha }}
          aici_ref: 1c54573ab1cc5138356cfa9abeabdc681f7f897f
