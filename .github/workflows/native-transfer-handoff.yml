name: Native Grease handoff checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: isomorphisms/ai-ci/transfer-handoff@bff8c41e225da57e39d0242f02dcce46f38c3130
        with:
          catfood_ref: c16dcf0ab5057cbfd9cc7b0fedad587300724873
          kitchen_ref: 32c3bf2d7c6268b50f1e48395dc972cfbafec7a9
          fp_ref: ${{ github.event.pull_request.head.sha || github.sha }}
          aici_ref: bff8c41e225da57e39d0242f02dcce46f38c3130
