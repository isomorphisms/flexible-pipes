name: RMR real-converter host acceptance (FP/AICI)

on:
  push:
    branches: ['work/rmr-signing-restore']
    paths:
      - 'tasks/rmr-signing-restore/**'
      - 'registry/rmr-signing-restore.json'
      - 'pipelines/rmr-signing-restore-host.json'
      - 'scripts/rmr-host-test.py'
      - '.github/workflows/rmr-signing-restore.yml'
  pull_request:
    paths:
      - 'tasks/rmr-signing-restore/**'
      - 'registry/rmr-signing-restore.json'
      - 'pipelines/rmr-signing-restore-host.json'
      - 'scripts/rmr-host-test.py'
      - '.github/workflows/rmr-signing-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-host-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Flexible Pipes candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned actual reading converter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/remind-me-to-read
          ref: 15033b9188c7367d2cc0a627f6c0991af074fa23
          path: _reading/producer
          persist-credentials: false
      - name: Check out pinned independent AI-CI oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 586c0c68be50b456e194dad8e386113c82846b68
          path: _reading/aici
          persist-credentials: false
      - name: Execute registered Flexible Pipes producer and independent stages
        run: python3 scripts/run-pipeline rmr-signing-restore-host
      - name: Retain real FP receipts and synthetic ZIP/TAR evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmr-fp-aici-host-${{ github.sha }}
          path: |
            .flexible-pipes/runs/rmr-signing-restore-host-*/
            _reading/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
