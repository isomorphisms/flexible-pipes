name: Generic GitHub fork script
on:
  push:
    paths:
      - 'scripts/render-github-fork-script'
      - 'scripts/run-pipeline'
      - 'pipelines/github-fork-script.json'
      - 'tests/github-fork-script.py'
      - 'tests/github-fork-kitchen-parity.py'
      - '.github/workflows/github-fork-script.yml'
  pull_request:
    paths:
      - 'scripts/render-github-fork-script'
      - 'scripts/run-pipeline'
      - 'pipelines/github-fork-script.json'
      - 'tests/github-fork-script.py'
      - 'tests/github-fork-kitchen-parity.py'
      - '.github/workflows/github-fork-script.yml'
permissions:
  contents: read
jobs:
  exact-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: flexible-pipes
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/kitchen
          ref: abfe5e9440e3b87d8712cae4a45a716a347fa1e5
          path: kitchen
      - run: python3 flexible-pipes/tests/github-fork-script.py
        working-directory: flexible-pipes
      - run: python3 tests/github-fork-kitchen-parity.py --kitchen-root ../kitchen
        working-directory: flexible-pipes
