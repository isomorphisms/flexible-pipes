name: Registered Kitchen operation qualification
on:
  # Delivery, admission, bootstrap, runtime and workflow changes all affect
  # qualification. A partial path list silently skipped required rechecks.
  pull_request:
  push:
    branches: [implement/fp2-runtime-qualification]
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: flexible-pipes
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: ithon
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/kitchen
          ref: c978349774f67cd7eadb4f469e41773b8a6dce61
          path: kitchen
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 64b916d08c2fb4877fcdb940ca6ec219afba1467
          path: ai-ci
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/catfood
          ref: 894e9048b1addd549e03e3972fa11f1d6ff43f52
          path: catfood
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          submodules: recursive
          path: runtime/grease
          persist-credentials: false
      - name: Existing Cat Food Grease bootstrap recipe only
        # Reuse the maintained runtime recipe; this is not the Kitchen POSIX
        # source-test exception and introduces no new bootstrap shell program.
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/runtime
          CATFOOD_JOBS: '2'
        run: /bin/sh catfood/build-tools.sh
      - name: Qualify the checked operation in disposable fixtures
        shell: /usr/bin/env runtime/.build/grease/bin/grease {0}
        run: /usr/bin/sudo /usr/bin/python3 ithon/ithon_host.py flexible-pipes/tests/registered-execution/qualify-operation.pi '${{ github.workspace }}' /tmp/fp2-qualification '${{ github.workspace }}/runtime/grease/source' '${{ github.workspace }}/runtime/.build/grease/bin/grease' /usr/bin/python3 '${{ github.workspace }}/runtime/.build/grease/python2/python'
      - name: Package partial qualification state
        if: always()
        shell: /usr/bin/env runtime/.build/grease/bin/grease {0}
        run: /usr/bin/sudo /usr/bin/python3 ithon/ithon_host.py flexible-pipes/scripts/package-qualification.pi /tmp/fp2-qualification
      - name: Preserve every qualification attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fp2-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/fp2-qualification.tar.gz
          if-no-files-found: error
