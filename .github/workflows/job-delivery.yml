name: Job delivery runtime
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  delivery-runtime:
    name: ${{ github.event_name == 'pull_request' && 'delivery-runtime' || format('delivery-runtime-{0}', github.event_name) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact Flexible Pipes source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out independently enforced delivery gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 11fd978b442f4538d80663bb1b70e2f5fef455d4
          path: _aici
          persist-credentials: false
      - name: Check out qualified checked Ithon interface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: _ithon
          persist-credentials: false
      - name: Exercise real delivery ordering and runner hold
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/_aici/validators
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/job-delivery-checked.jsonl
        run: >-
          python3 scripts/run-pipeline fp35-delivery-acceptance
          --param "ithon=$GITHUB_WORKSPACE/_ithon/ithon"
          --param "fp-root=$GITHUB_WORKSPACE"
          --param "aici-root=$GITHUB_WORKSPACE/_aici"
          --param "aici-test=$GITHUB_WORKSPACE/_aici/tests/job-delivery/check.pi"
          --param "results=$RUNNER_TEMP/fp35-delivery-results"
          --runs-root "$RUNNER_TEMP/fp35-delivery-runs"
      - name: Preserve existing pipeline handoffs
        run: bash tests/run-pipeline-preflight.sh
      - name: Retain exact checked inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: job-delivery-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/job-delivery-checked.jsonl
            ${{ runner.temp }}/fp35-delivery-results/
            ${{ runner.temp }}/fp35-delivery-runs/
          if-no-files-found: error
