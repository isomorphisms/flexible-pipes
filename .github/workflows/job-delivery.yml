name: Job delivery runtime
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  delivery-runtime:
    name: ${{ github.event_name == 'pull_request' && 'delivery-runtime' || format('delivery-runtime-{0}', github.event_name) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact Flexible Pipes source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out independently enforced delivery gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 0fd7edc39ec260240f007316d3905c0c0b777f0f
          path: _aici
          persist-credentials: false
      - name: Check out exact Kitchen generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/kitchen
          ref: 32c3bf2d7c6268b50f1e48395dc972cfbafec7a9
          path: _kitchen
          persist-credentials: false
      - name: Check out qualified checked Ithon interface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: _ithon
          persist-credentials: false
      - name: Acquire exact native Grease runtime for command-byte comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/grease"
          gh api repos/dilapidated-shed/grease/actions/artifacts/12192502970/zip > "$RUNNER_TEMP/grease.zip"
          printf '%s  %s\n' 295329ec3bb419d90364fcb5937eafe4306b03f68b7aaa63089dadde8082ffb5 "$RUNNER_TEMP/grease.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/grease.zip" '_bin/cxx-asan/ysh' -d "$RUNNER_TEMP/grease"
          printf '%s  %s\n' 7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c "$RUNNER_TEMP/grease/_bin/cxx-asan/ysh" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/grease/_bin/cxx-asan/ysh"
      - name: Exercise real delivery ordering and runner hold
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/_aici/validators
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/job-delivery-checked.jsonl
        run: >-
          python3 scripts/run-pipeline-legacy.py fp35-delivery-acceptance
          --param "ithon=$GITHUB_WORKSPACE/_ithon/ithon"
          --param "fp-root=$GITHUB_WORKSPACE"
          --param "aici-root=$GITHUB_WORKSPACE/_aici"
          --param "aici-test=$GITHUB_WORKSPACE/_aici/tests/job-delivery/check.pi"
          --param "results=$RUNNER_TEMP/fp35-delivery-results"
          --param "kitchen=$GITHUB_WORKSPACE/_kitchen"
          --param "grease=$RUNNER_TEMP/grease/_bin/cxx-asan/ysh"
          --runs-root "$RUNNER_TEMP/fp35-delivery-runs"
      - name: Exercise the repaired review pipeline entrypoint
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/_aici/validators
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/pr-judge-delivery-checked.jsonl
        run: >-
          python3 scripts/run-pipeline-legacy.py pr-judge-01-review
          --param "ithon=$GITHUB_WORKSPACE/_ithon/ithon"
          --param "fp-root=$GITHUB_WORKSPACE"
          --param "aici-root=$GITHUB_WORKSPACE/_aici"
          --param "aici-test=$GITHUB_WORKSPACE/_aici/tests/job-delivery/check.pi"
          --param "results=$RUNNER_TEMP/pr-judge-delivery-results"
          --param "kitchen=$GITHUB_WORKSPACE/_kitchen"
          --param "grease=$RUNNER_TEMP/grease/_bin/cxx-asan/ysh"
          --runs-root "$RUNNER_TEMP/pr-judge-delivery-runs"
      - name: Preserve existing pipeline handoffs
        run: bash tests/run-pipeline-preflight.sh
      - name: Retain exact checked inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: job-delivery-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/job-delivery-checked.jsonl
            ${{ runner.temp }}/fp35-delivery-results/
            ${{ runner.temp }}/fp35-delivery-runs/
            ${{ runner.temp }}/pr-judge-delivery-results/
            ${{ runner.temp }}/pr-judge-delivery-runs/
            ${{ runner.temp }}/pr-judge-delivery-checked.jsonl
          if-no-files-found: error
