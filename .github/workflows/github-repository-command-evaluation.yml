name: GPT-OSS repository command evaluation harness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  prompt-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: flexible-pipes
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 52c8ae726ed586aef7a614d7f20aa6db57a1ec63
          path: aici
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: _ithon
          persist-credentials: false
      - name: Run actual checked Ithon with full positive and rejecting controls
        env:
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/command-evaluation-frontend.jsonl
        run: _ithon/ithon flexible-pipes/tests/github-repository-command-evaluation.pi flexible-pipes aici _ithon/ithon _evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: command-evaluation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            _evidence/
            flexible-pipes/evals/github-repository-transfer/
            flexible-pipes/models/catalog.toml
            flexible-pipes/tests/github-repository-command-evaluation.pi
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: command-evaluation-frontend-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/command-evaluation-frontend.jsonl
          if-no-files-found: error
