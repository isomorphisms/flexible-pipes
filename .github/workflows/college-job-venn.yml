name: College and good jobs Venn (Flexible Pipes)

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  render-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric
          ref: 2734ac5a86610eddfab73b1644d72b4ac85a65ee
          path: runtime/idric
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg build-essential curl util-linux
          python3 -m pip install Pillow==12.3.0
      - name: Restore pinned host compiler
        id: compiler-cache
        uses: actions/cache@v4
        with:
          path: runtime/idric
          key: venn-idric-host-2734ac5a86610eddfab73b1644d72b4ac85a65ee-v1
      - name: Bootstrap the Idriç host checker, not a native movie backend
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: runtime/idric
        run: |
          ./edric scheme
          ./edric bootstrap
      - name: Bind compiler identity
        run: |
          test "$(git -C runtime/idric rev-parse HEAD)" = 2734ac5a86610eddfab73b1644d72b4ac85a65ee
          test -z "$(git -C runtime/idric status --porcelain --untracked-files=no)"
          runtime/idric/build/exec/idris2 --version
      - name: Compile dependent semantic source with pinned Idriç
        run: |
          mkdir -p .flexible-pipes/artifacts/college-job-venn
          runtime/idric/build/exec/idris2 --source-dir models --cg node -o college-venn-model models/CollegeVenn.idric
          node build/exec/college-venn-model > .flexible-pipes/artifacts/college-job-venn/model.tsv
      - name: Run checked-in Flexible Pipes pipeline
        run: python3 scripts/run-pipeline college-job-venn
      - name: Retain actual source, model, movie and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: college-job-venn-media
          include-hidden-files: true
          path: |
            .flexible-pipes/
            models/CollegeVenn.idric
            scripts/render-college-job-venn.py
            tests/check-college-job-venn.py
            examples/college-job-venn.json
            build/exec/college-venn-model*
          if-no-files-found: error
