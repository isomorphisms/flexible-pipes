name: College and good jobs Venn (Flexible Pipes)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/college-job-venn.yml
      - examples/college-job-venn.json
      - pipelines/college-job-venn.json
      - scripts/render-college-job-venn.py
      - tests/check-college-job-venn.py
      - scripts/run-pipeline

permissions:
  contents: read

jobs:
  render-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python3 -m pip install Pillow==12.3.0
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Check video encoder
        run: |
          command -v ffmpeg
          command -v ffprobe
          command -v python3
      - name: Run checked-in Flexible Pipes pipeline
        run: python3 scripts/run-pipeline college-job-venn
      - name: Publish video, GIF, preview, receipts
        uses: actions/upload-artifact@v4
        with:
          name: college-job-venn-media
          path: |
            .flexible-pipes/artifacts/college-job-venn/*.mp4
            .flexible-pipes/artifacts/college-job-venn/*.gif
            .flexible-pipes/artifacts/college-job-venn/*.png
            .flexible-pipes/artifacts/college-job-venn/*.json
            .flexible-pipes/runs/
          if-no-files-found: error
