name: Amazon product lookup integration

on:
  pull_request:

permissions:
  contents: read

jobs:
  amazon-product-lookup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/kitchen
          ref: 2c7d45076bd66a0c278018882209db3e6dde404e
          path: _runtime/kitchen
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Ashtray-Archer/az
          ref: 55dd2bdf1a4c90716e237ea242533b04a84d8a11
          path: _runtime/az
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 59c0514e93686de413230bed5d8b316ba0e6f5a2
          path: _catfood-build
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: 94d051fccf7ce6e38da90112d18cb2bf3554769f
          path: _runtime/grease
          submodules: recursive
          persist-credentials: false
      - name: Establish Cat Food's exact Grease and AZ stable commands
        shell: sh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential jq libreadline-dev libffi-dev
          CATFOOD_ROOT="$PWD/_runtime" sh _catfood-build/build-tools.sh
          sh _catfood-build/update-tools.ysh "$PWD/_runtime" 12 _catfood-build/tools.tsv 1
          test -x _runtime/bin/grease
          test -x _runtime/bin/az
          git -C _runtime/kitchen rev-parse HEAD:tasks/product-lookup/amazon-az.sh
          git -C _runtime/az rev-parse HEAD:bin/az
      - name: Exact-head end-to-end commands and rejecting mutants
        shell: sh
        env:
          KITCHEN_ROOT: ${{ github.workspace }}/_runtime/kitchen
          CATFOOD_ROOT: ${{ github.workspace }}/_runtime
        run: |
          dash -n scripts/amazon-az scripts/amazon-product-lookup tests/amazon-product-lookup.sh
          sh tests/amazon-product-lookup.sh
