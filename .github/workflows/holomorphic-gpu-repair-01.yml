name: Registered Holomorphic GPU repair qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pipelines/holomorphic-gpu-repair-01.json'
      - 'registry/holomorphic-gpu-repair-01.json'
      - 'tasks/holomorphic-gpu-repair/**'
      - '.github/workflows/holomorphic-gpu-repair-01.yml'

permissions:
  contents: read
  actions: read

jobs:
  host-mathematics:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - name: Check out exact Flexible Pipes head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Narrow stage-zero boundary: Grease cannot acquire itself. Product,
      # acceptance and build recipes below use the checked Grease executable.
      - name: Acquire the exact published native Grease artifact
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p _holomorphic/runtime
          gh api repos/dilapidated-shed/grease/actions/artifacts/11727693085/zip > "$RUNNER_TEMP/holomorphic-grease.zip"
          printf '%s  %s\n' 20c526c8bae5dc32a7b3d01a39eca5bdb7ee4c63fe540f34a07af7ba8b0d0039 "$RUNNER_TEMP/holomorphic-grease.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/holomorphic-grease.zip" _bin/cxx-asan/ysh > _holomorphic/runtime/ysh
          printf '%s  %s\n' 7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c _holomorphic/runtime/ysh | sha256sum -c -
          chmod 755 _holomorphic/runtime/ysh

      - name: Load reviewed immutable source pins
        id: pins
        shell: '/usr/bin/env _holomorphic/runtime/ysh {0}'
        run: |
          set -o errexit -o nounset -o pipefail
          for role in holomorphic aici shader-backend kitchen ike ithon {
              var hash = "$(awk -F '\t' -v key="$role" '$1 == key { print $2 }' tasks/holomorphic-gpu-repair/source-pins.tsv)"
              printf '%s\n' "$hash" | grep -Eq '^[0-9a-f]{40}$'
              printf '%s=%s\n' "$role" "$hash" >> "$[ENV.GITHUB_OUTPUT]"
          }

      - name: Materialize the continued Holomorphic implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/holomorphic
          ref: ${{ steps.pins.outputs.holomorphic }}
          path: _holomorphic/holomorphic
          persist-credentials: false
      - name: Materialize independent mathematical acceptance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: ${{ steps.pins.outputs.aici }}
          path: _holomorphic/aici
          persist-credentials: false
      - name: Materialize the retained checked-shader compiler pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: fuego-ironworks/idris-shader-backend
          ref: ${{ steps.pins.outputs['shader-backend'] }}
          path: _holomorphic/backend
          persist-credentials: false
      - name: Materialize reviewed Kitchen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/kitchen
          ref: ${{ steps.pins.outputs.kitchen }}
          path: _holomorphic/kitchen
          persist-credentials: false
      - name: Materialize Ike
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ike
          ref: ${{ steps.pins.outputs.ike }}
          path: _holomorphic/ike
          persist-credentials: false
      - name: Materialize the selected Ithon checked-source host interface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ithon
          ref: ${{ steps.pins.outputs.ithon }}
          path: _holomorphic/ithon
          persist-credentials: false

      - name: Bootstrap and independently qualify the exact native ICK compiler
        id: ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8

      - name: Prepare digest-bound host materials and ICK-built Ike
        shell: '/usr/bin/env _holomorphic/runtime/ysh {0}'
        env:
          HOLOMORPHIC_ICK_HOST: ${{ steps.ick.outputs.compiler }}
        run: |
          set -o errexit -o nounset -o pipefail
          var workspace = ENV.GITHUB_WORKSPACE
          _holomorphic/runtime/ysh tasks/holomorphic-gpu-repair/prepare-host-context.grease "$workspace" "$workspace/_holomorphic/run"

      - name: Execute the registered mathematical and provenance stages
        shell: '/usr/bin/env _holomorphic/runtime/ysh {0}'
        env:
          GREASE_BINARY: ${{ github.workspace }}/_holomorphic/runtime/ysh
        run: |
          set -o errexit -o nounset -o pipefail
          var python = "$(command -v python3)"
          var workspace = ENV.GITHUB_WORKSPACE
          _holomorphic/runtime/ysh _holomorphic/kitchen/tasks/holomorphic-gpu-repair/test-admission.grease \
              "$workspace/_holomorphic/runtime/ysh" \
              "$workspace/_holomorphic/kitchen/tasks/holomorphic-gpu-repair/4.grease" \
              "$workspace/_holomorphic/run" "$workspace/_holomorphic/admission-fixtures"
          "$python" scripts/run-pipeline holomorphic-gpu-repair-01 \
              --param "kitchen_recipe=$workspace/_holomorphic/kitchen/tasks/holomorphic-gpu-repair/4.grease" \
              --param "context=$workspace/_holomorphic/run"

      - name: Preserve true receipts and boundary-specific classifications
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: holomorphic-gpu-repair-host-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .flexible-pipes/runs/holomorphic-gpu-repair-01-*/
            _holomorphic/run/
            _holomorphic/admission-fixtures/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
