name: Data-only pipeline request notice
on:
  push:
    branches: [pipeline-requests]
    paths: [requests/*.json]
permissions:
  contents: read
jobs:
  notice:
    runs-on: ubuntu-24.04
    steps:
      # No request checkout and no executable request content. Completion is
      # merely a notification to the default-branch workflow_run processor.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-only-notice-${{ github.run_id }}
          path: /nonexistent-flexible-pipes-notice
          if-no-files-found: ignore
