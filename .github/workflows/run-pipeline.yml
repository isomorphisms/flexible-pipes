name: Run flexible-pipes pipeline
on:
  workflow_dispatch:
    inputs:
      request:
        description: Data-only registered request JSON
        required: true
        type: string
  workflow_run:
    workflows: [Data-only pipeline request notice]
    types: [completed]
    branches: [pipeline-requests]
permissions:
  contents: read
  id-token: write
jobs:
  registered:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: flexible-pipes
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: ithon
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/catfood
          ref: 894e9048b1addd549e03e3972fa11f1d6ff43f52
          path: catfood
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          submodules: recursive
          path: runtime/grease
          persist-credentials: false
      - name: Existing Cat Food runtime bootstrap
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/runtime
          CATFOOD_JOBS: '2'
        run: /bin/sh catfood/build-tools.sh
      - name: Prepare fixed transport client
        shell: /usr/bin/env runtime/.build/grease/bin/grease {0}
        run: /usr/bin/sudo /usr/bin/python3 ithon/ithon_host.py flexible-pipes/scripts/install-client.pi '${{ github.workspace }}' '${{ github.workspace }}/runtime/.build/grease/bin/grease'
      - name: Submit signed event to separate supervisor
        shell: /opt/catfood/bin/grease {0}
        run: /opt/flexible-pipes/current/scripts/run-pipeline github-event "$[ENV.GITHUB_EVENT_PATH]"
      - name: Export verified service result and bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flexible-pipes-${{ github.run_id }}-${{ github.run_attempt }}
          path: /var/lib/flexible-pipes/export/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
