name: Run flexible-pipes pipeline
on:
  workflow_dispatch:
    inputs:
      request:
        description: Data-only registered request JSON
        required: true
        type: string
  workflow_run:
    workflows: [Data-only pipeline request notice]
    types: [completed]
    branches: [pipeline-requests]
permissions:
  contents: read
  id-token: write
jobs:
  registered:
    # A separately provisioned trusted supervisor. No runtime installation or
    # authority activation is performed by a request or this workflow.
    runs-on: [self-hosted, flexible-pipes-registered-v1]
    timeout-minutes: 5
    steps:
      - name: Process signed event using the installed qualified release
        shell: /opt/catfood/bin/grease {0}
        run: /opt/flexible-pipes/current/scripts/run-pipeline github-event "$GITHUB_EVENT_PATH"
      - name: Export only supervisor-owned verified results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flexible-pipes-${{ github.run_id }}-${{ github.run_attempt }}
          path: /var/lib/flexible-pipes/export/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
