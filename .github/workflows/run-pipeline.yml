name: Run flexible-pipes pipeline
on:
  workflow_dispatch:
    inputs:
      request:
        description: Data-only registered request JSON
        required: true
        type: string
  workflow_run:
    workflows: [Data-only pipeline request notice]
    types: [completed]
    branches: [pipeline-requests]
permissions:
  contents: read
  id-token: write
jobs:
  registered:
    if: github.repository == 'isomorphisms/flexible-pipes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: flexible-pipes
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: ithon
          persist-credentials: false
      - name: Check inactive deployment without installation or token acquisition
        # Both events stop here until independently accepted non-C++ runtime
        # closure and installed promotion are supplied by their owning jobs.
        # The installed client and separate supervisor remain the sole engine.
        run: /usr/bin/python3 ithon/ithon_host.py flexible-pipes/scripts/github-event.pi readiness '${{ github.workspace }}/flexible-pipes/deployment/client.json' '${{ runner.temp }}/registered-result'
      - name: Export verified service result and bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flexible-pipes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registered-result/
          if-no-files-found: error
