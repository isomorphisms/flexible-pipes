name: Run flexible-pipes pipeline

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: Checked-in pipeline name
        required: true
        default: regression-history-smoke
        type: string
      action:
        description: Amazon lookup action (search, link, price)
        required: false
        type: string
      target:
        description: Amazon query text or product ASIN
        required: false
        type: string
      role:
        description: exterior-weatherstrip, interior-moisture-barrier, unknown
        required: false
        type: string
      tag:
        description: Explicit Associates tag
        required: false
        type: string
  push:
    branches:
      - pipeline-requests
    paths:
      - requests/*.json

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select pipeline and immutable request parameters
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PIPELINE: ${{ inputs.pipeline }}
          DISPATCH_ACTION: ${{ inputs.action }}
          DISPATCH_TARGET: ${{ inputs.target }}
          DISPATCH_ROLE: ${{ inputs.role }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          keys = ("pipeline", "action", "target", "role", "tag")
          for key in keys:
              val = os.environ.get("DISPATCH_" + key.upper(), "")
              if any(ord(char) < 32 or ord(char) == 127 for char in val):
                  raise SystemExit("control character in dispatch parameter " + key)
              if key == "pipeline" and not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", val):
                  raise SystemExit("invalid pipeline")
              print(key + "=" + val)
          PY
            exit 0
          fi

          mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'requests/*.json')
          if [ "${#files[@]}" -ne 1 ]; then
            printf 'expected exactly one changed request JSON, got %s\n' "${#files[@]}" >&2
            exit 2
          fi
          python3 - "${files[0]}" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import sys
          from pathlib import Path

          request = json.loads(Path(sys.argv[1]).read_text())
          pipeline = request.get("pipeline")
          params = request.get("parameters", {})
          if not isinstance(pipeline, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", pipeline):
              raise SystemExit("request pipeline must be a valid pipeline name")
          if not isinstance(params, dict) or set(params) - {"action", "target", "role", "tag"}:
              raise SystemExit("unsupported pipeline request parameters")
          print("pipeline=" + pipeline)
          for key in ("action", "target", "role", "tag"):
              value = params.get(key, "")
              if not isinstance(value, str) or any(ord(c) < 32 or ord(c) == 127 for c in value):
                  raise SystemExit("invalid parameter " + key)
              print(key + "=" + value)
          PY

      # These exact pins are an unmerged candidate. There is no implicit
      # fallback to an anonymous or live-hosted AZ installation.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ steps.select.outputs.pipeline == 'amazon-product-lookup' }}
        with:
          repository: isomorphisms/kitchen
          ref: 2c7d45076bd66a0c278018882209db3e6dde404e
          path: _runtime/kitchen
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ steps.select.outputs.pipeline == 'amazon-product-lookup' }}
        with:
          repository: Ashtray-Archer/az
          ref: cf3aa04cfba2da2158bfccf3d8744481156903d5
          path: _runtime/az
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ steps.select.outputs.pipeline == 'amazon-product-lookup' }}
        with:
          repository: isomorphisms/catfood
          ref: 7f1c213d64dc9a9e32a191431ae471ad8d42cba7
          path: _catfood-build
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ steps.select.outputs.pipeline == 'amazon-product-lookup' }}
        with:
          repository: dilapidated-shed/grease
          ref: 94d051fccf7ce6e38da90112d18cb2bf3554769f
          submodules: recursive
          path: _runtime/grease
          persist-credentials: false
      - name: Prepare pinned Cat Food stable AZ and Grease commands
        if: ${{ steps.select.outputs.pipeline == 'amazon-product-lookup' }}
        shell: sh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential jq libreadline-dev libffi-dev
          CATFOOD_ROOT="$PWD/_runtime" sh _catfood-build/build-tools.sh
          sh _catfood-build/update-tools.ysh "$PWD/_runtime" 12 _catfood-build/tools.tsv 1
          test -x _runtime/bin/grease && test -x _runtime/bin/az

      - name: Run pipeline
        shell: bash
        env:
          PIPELINE: ${{ steps.select.outputs.pipeline }}
          ACTION: ${{ steps.select.outputs.action }}
          TARGET: ${{ steps.select.outputs.target }}
          ROLE: ${{ steps.select.outputs.role }}
          TAG: ${{ steps.select.outputs.tag }}
          KITCHEN_ROOT: ${{ github.workspace }}/_runtime/kitchen
          CATFOOD_ROOT: ${{ github.workspace }}/_runtime
        run: |
          set -euo pipefail
          if [ "$PIPELINE" = amazon-product-lookup ]; then
            python3 scripts/run-pipeline "$PIPELINE" \
              --param "action=$ACTION" --param "target=$TARGET" \
              --param "role=$ROLE" --param "tag=$TAG"
          else
            python3 scripts/run-pipeline "$PIPELINE"
          fi

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexible-pipes-${{ github.run_id }}
          path: .flexible-pipes/runs/
          if-no-files-found: warn
