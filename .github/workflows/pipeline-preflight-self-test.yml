name: Pipeline preflight self-test

on:
  pull_request:
    paths:
      - "scripts/run-pipeline"
      - "scripts/android-producer-stage"
      - "scripts/run-android-apk-preflight"
      - "pipelines/android-apk-preflight.json"
      - "tests/run-pipeline-preflight.sh"
      - "registry/android-native-applications.tsv"
      - "pipelines/android-native-apk.json"
      - "tests/android-native-apk.sh"
      - "docs/android-native-apk.md"
      - ".github/workflows/pipeline-preflight-self-test.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/run-pipeline"
      - "scripts/android-producer-stage"
      - "scripts/run-android-apk-preflight"
      - "pipelines/android-apk-preflight.json"
      - "tests/run-pipeline-preflight.sh"
      - ".github/workflows/pipeline-preflight-self-test.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run hostile preflight cases
        shell: bash
        run: |
          bash tests/run-pipeline-preflight.sh
          bash tests/android-native-apk.sh
