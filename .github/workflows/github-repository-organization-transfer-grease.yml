name: Grease GitHub repository organization transfer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checked-organization-transfer:
    name: ${{ github.event_name == 'pull_request' && 'checked-organization-transfer' || format('checked-organization-transfer-{0}', github.event_name) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: flexible-pipes
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/kitchen
          ref: 32c3bf2d7c6268b50f1e48395dc972cfbafec7a9
          path: kitchen
      - name: Validate retained C67 live-transfer evidence
        run: sh tests/c67-live-transfer-evidence.sh
        working-directory: flexible-pipes
      - name: Parse the dedicated Walnut & Burgundy Termux entrypoint
        run: bash -n scripts/move-new-walnut-burgundy-repositories-from-termux
        working-directory: flexible-pipes
      - name: Reject the C67-failing generator readability predicate
        run: sh tests/c67-generator-readability-regression.sh
        working-directory: flexible-pipes
      - name: Build the scoped Grease runtime for transfer fixtures
        id: grease
        uses: isomorphisms/ai-ci/grease-fixtures@9b608a1c6b6db5e9f293dbb562dd261f4bd6cd64
      - name: Test Kitchen generation under native Grease
        env:
          GREASE_BINARY: ${{ steps.grease.outputs.executable }}
        run: sh tests/github-repository-transfer-grease.sh
        working-directory: kitchen
      - name: Test FP, generated program, identity and rerun under native Grease
        env:
          KITCHEN_ROOT: ${{ github.workspace }}/kitchen
          GREASE_BINARY: ${{ steps.grease.outputs.executable }}
        run: sh tests/github-repository-organization-transfer-grease.sh
        working-directory: flexible-pipes
      - name: Test the exact ten-repository batch and idempotent rerun
        env:
          KITCHEN_ROOT: ${{ github.workspace }}/kitchen
          GREASE_BINARY: ${{ steps.grease.outputs.executable }}
        run: sh tests/github-new-math-batch-transfer-grease.sh
        working-directory: flexible-pipes
      - name: Retain the Grease build receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: organization-transfer-grease-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ steps.grease.outputs.receipt }}
          if-no-files-found: warn
