name: Subpixel registered host qualification
on:
  push:
    branches: ['work/subpixel-registration', 'work/subpixel-path-font-registration']
    paths:
      - 'pipelines/subpixel-acceptance.json'
      - 'registry/subpixel-acceptance.json'
      - 'tasks/subpixel/**'
      - 'tests/subpixel-registration.grease'
      - '.github/workflows/subpixel-acceptance.yml'
      - 'scripts/run-pipeline'
  pull_request:
    paths:
      - 'pipelines/subpixel-acceptance.json'
      - 'registry/subpixel-acceptance.json'
      - 'tasks/subpixel/**'
      - 'tests/subpixel-registration.grease'
      - '.github/workflows/subpixel-acceptance.yml'
      - 'scripts/run-pipeline'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  subpixel-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - name: Check out exact FP candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Materialize pinned Kitchen recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/kitchen
          ref: 2b4dc2662ded1d2498e30c60fc3591e4b7d60881
          path: _subpixel/kitchen
          persist-credentials: false
      - name: Materialize exact producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/rough.framebuffer
          ref: f33a476c69da313745b58c10cf8057765f9cbec9
          path: _subpixel/producer
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize independent oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: ff1a22e2b181cabb882db0d5ae42012529c7e41c
          path: _subpixel/aici
          persist-credentials: false
      - name: Materialize owned ICK and retained GCC reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ick
          ref: c61e448251744a2f40ad743ebef1a027bdcd2f9d
          path: _subpixel/ick
          submodules: true
          persist-credentials: false
      - name: Materialize the actual Conway geometry consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/Conway
          ref: 42c99ed0d289162b6fd62d864fbf58fc042e24d8
          path: _subpixel/conway
          persist-credentials: false
      - name: Materialize owned Ike source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ike
          ref: a92fe68bf8aad8dfcfe9f7a7abd84e07290f7fe0
          path: _subpixel/ike
          persist-credentials: false
      # Narrow stage-zero shell boundary: acquire the real native Grease binary
      # before Grease can execute. This does not implement product/build policy.
      - name: Acquire and verify published native Grease runtime
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p _subpixel/runtime/bin
          gh api repos/dilapidated-shed/grease/actions/artifacts/12192502970/zip > "$RUNNER_TEMP/subpixel-grease.zip"
          printf '%s  %s\n' 295329ec3bb419d90364fcb5937eafe4306b03f68b7aaa63089dadde8082ffb5 "$RUNNER_TEMP/subpixel-grease.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/subpixel-grease.zip" _bin/cxx-asan/ysh > _subpixel/runtime/bin/ysh
          # Only reuse the portable launcher from this archive, never its ARM engine.
          curl --fail --location --silent --show-error \
              https://github.com/isomorphisms/grease/releases/download/tablet-aarch64-9b3dc8904891/grease-aarch64-termux.tar.gz \
              --output "$RUNNER_TEMP/subpixel-grease-portable.tar.gz"
          printf '%s  %s\n' 3ddb962ef313e528e525fa03518f494577e921c2201ecb49f7a11f2fbf4e82b2 "$RUNNER_TEMP/subpixel-grease-portable.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/subpixel-grease-portable.tar.gz" -C _subpixel/runtime ./bin/grease
          mkdir -p _subpixel/ick-artifact
          gh api repos/isomorphisms/billiard/actions/artifacts/12174071008/zip > _subpixel/ick-stage.zip
          printf '%s  %s\n' 8ee043088fffadba3704fd567c206c4852b0de69f0b8bb76a131bfb8fa4004a4 _subpixel/ick-stage.zip | sha256sum -c -
          unzip -p _subpixel/ick-stage.zip ick-host-stage.tar.gz > "$RUNNER_TEMP/subpixel-ick-stage.tar.gz"
          tar --no-same-owner -xzf "$RUNNER_TEMP/subpixel-ick-stage.tar.gz" -C _subpixel/ick-artifact
          sha256sum -c tasks/subpixel/materials.sha256
          chmod 755 _subpixel/runtime/bin/grease _subpixel/runtime/bin/ysh
      - name: Install declared ICK artifact runtime and host object linker
        shell: sh
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp10 libmpfr6 libmpc3 libisl23 libzstd1 binutils gcc
      - name: Verify refusals before any compiler build
        shell: '/usr/bin/env _subpixel/runtime/bin/grease {0}'
        run: |
          set -o errexit -o nounset -o pipefail
          var python = "$(command -v python3)"
          var workspace = ENV.GITHUB_WORKSPACE
          _subpixel/runtime/bin/grease tests/subpixel-registration.grease "$workspace" "$workspace/_subpixel/runtime/bin/grease" "$python"
          _subpixel/runtime/bin/grease _subpixel/kitchen/tasks/subpixel/test-independent-log.grease \
              "$workspace/_subpixel/runtime/bin/grease" "$workspace/_subpixel/kitchen/tasks/subpixel"
          _subpixel/runtime/bin/grease _subpixel/kitchen/tasks/subpixel/test-collection.grease
      - name: Execute the named FP pipeline
        shell: '/usr/bin/env _subpixel/runtime/bin/grease {0}'
        run: |
          set -o errexit -o nounset -o pipefail
          var python = "$(command -v python3)"
          var workspace = ENV.GITHUB_WORKSPACE
          "$python" scripts/run-pipeline subpixel-acceptance --param "workspace=$workspace"
      - name: Retain real stage receipts, diagnostics and PPM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: subpixel-host-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .flexible-pipes/runs/subpixel-acceptance-*/
            _subpixel/evidence/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
