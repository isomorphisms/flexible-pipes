name: Modified Icky Lua runtime
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prerequisite:
    runs-on: ubuntu-24.04
    steps:
      - name: Exact Flexible Pipes head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve the managed runtime boundary
        run: cp ci/modified-lua-prerequisite.tsv modified-lua-prerequisite.tsv
      - name: Report the missing accepted runtime
        run: cat modified-lua-prerequisite.tsv
      # Replace this stop only with the Cat Food acquisition and independent
      # ai-ci acceptance for an exact compatible C++-free Grease package.
      # A renamed partial D shell or historical C++ artifact cannot release it.
      - name: BLOCKED compatible C++-free Grease is not independently accepted
        run: exit 1
      - name: Preserve prerequisite receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modified-lua-prerequisite-${{ github.event.pull_request.head.sha || github.sha }}
          path: modified-lua-prerequisite.tsv
          if-no-files-found: error
  runtime:
    needs: prerequisite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - name: Exact Flexible Pipes head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact modified Lua source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/lua
          ref: 87306483cec50f8c750a22dda1d0742246fad756
          path: lua-source
          fetch-depth: 0
          persist-credentials: false
      - name: Same-version stock control
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/lua
          ref: 0b29f408433e92953cc72b1d3e06c7ac8139e439
          path: stock-source
          persist-credentials: false
      - name: Exact qualified host ICK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/fastchat
          run-id: 37589849631
          artifact-ids: 11468256648
          merge-multiple: true
          github-token: ${{ github.token }}
          path: host-ick
      - name: Shared build policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/ai-ci
          ref: 01608a2493fa409463f70e8fbfd8a123ef59ee85
          path: shared-policy
          persist-credentials: false
      - name: Restore artifact executable modes
        run: chmod +x host-ick/compiler/build/gcc/xgcc host-ick/compiler/build/gcc/cc1 host-ick/compiler/build/gcc/collect2
      - name: Producer dependency closure
        run: sudo apt-get install -y libgmp10 libmpfr6 libmpc3 libisl23 libzstd1 ripgrep
      - name: Build independent shared verifier through ICK
        run: >
          host-ick/compiler/build/gcc/xgcc -Bhost-ick/compiler/build/gcc/
          -B/usr/lib/gcc/x86_64-linux-gnu/13/
          -isystem /usr/lib/gcc/x86_64-linux-gnu/13/include
          -fno-use-linker-plugin -std=c11 -O2 shared-policy/src/aici.c -o shared-policy-check
      - name: Required shared build-toolchain contract
        run: ./shared-policy-check verify shared-policy/contracts/build-toolchain-v0.contract.tsv .
      - name: Build independent workflow verifier through ICK
        run: >
          host-ick/compiler/build/gcc/xgcc -Bhost-ick/compiler/build/gcc/
          -B/usr/lib/gcc/x86_64-linux-gnu/13/
          -isystem /usr/lib/gcc/x86_64-linux-gnu/13/include
          -fno-use-linker-plugin -std=c17 -O2 shared-policy/src/aici_github.c -o workflow-policy-check
      - name: Required shared workflow policy
        run: ./workflow-policy-check verify . - public
      - name: Actual interpreter and embedded literal-source qualification
        run: >
          grease-runtime/grease scripts/qualify-icky-lua.grease
          "$GITHUB_WORKSPACE/lua-source" "$GITHUB_WORKSPACE/host-ick/compiler/build/gcc/xgcc"
          "$GITHUB_WORKSPACE/host-ick/compiler/build/gcc" "$GITHUB_WORKSPACE/qualification/runtime"
      - name: Real stock, stale, PATH, library and source negative controls
        run: >
          grease-runtime/grease tests/modified-lua/negative-controls.grease
          "$GITHUB_WORKSPACE/lua-source" "$GITHUB_WORKSPACE/stock-source"
          "$GITHUB_WORKSPACE/host-ick/compiler/build/gcc/xgcc" "$GITHUB_WORKSPACE/host-ick/compiler/build/gcc"
          "$GITHUB_WORKSPACE/grease-runtime/grease" "$GITHUB_WORKSPACE/qualification/negative"
      - name: Preserve actual exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modified-lua-${{ github.event.pull_request.head.sha || github.sha }}
          path: qualification/
          if-no-files-found: error
