name: Run flexible-pipes pipeline

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: Checked-in pipeline name
        required: true
        default: regression-history-smoke
        type: string
  push:
    branches:
      - pipeline-requests
    paths:
      - requests/*.json

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select pipeline
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PIPELINE: ${{ inputs.pipeline }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            printf 'pipeline=%s\n' "$DISPATCH_PIPELINE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'requests/*.json')
          if [ "${#files[@]}" -ne 1 ]; then
            printf 'expected exactly one changed request JSON, got %s\n' "${#files[@]}" >&2
            exit 2
          fi
          pipeline="$(python3 - "${files[0]}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          request = json.loads(Path(sys.argv[1]).read_text())
          pipeline = request.get("pipeline")
          if not isinstance(pipeline, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", pipeline):
              raise SystemExit("request pipeline must be a valid pipeline name")
          print(pipeline)
          PY
          )"
          printf 'pipeline=%s\n' "$pipeline" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        env:
          PIPELINE: ${{ steps.select.outputs.pipeline }}
        run: python3 scripts/run-pipeline "$PIPELINE"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexible-pipes-${{ github.run_id }}
          path: .flexible-pipes/runs/
          if-no-files-found: error
